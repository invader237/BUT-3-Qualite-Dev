spring.application.name=banque

# ===============================
# = DATABASE (H2 in-memory for tests)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
# H2 in-memory database does not require a password for the default 'sa' user
spring.datasource.password=

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===============================
# = LIQUIBASE
# ===============================
spring.liquibase.enabled=false

# ===============================
# = JWT
# ===============================
jwt.secret=testSecretKeyThatIsLongEnoughForTestingPurposes1234567890
jwt.expiration.auth=3600000
jwt.expiration.reset=900000

# ===============================
# = MISC
# ===============================
spring.main.allow-bean-definition-overriding=true
